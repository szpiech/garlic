name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # Build and run the whole test suite.  This is the job that tells you whether
  # garlic still works.  zlib is the only dependency: GSL was replaced by
  # src/garlic-math.cpp, so there is nothing to install or vendor.
  test:
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, label: linux-x86_64, static: '', platform: ''}
          # The DEFAULT linux link is -static, and until this entry existed no job
          # built it: every one passed STATIC=.  That matters specifically for
          # std::thread, which decides at runtime whether threading is available by
          # testing a weak symbol -- in a static link that can come out unresolved
          # and the first thread constructor throws, at runtime, from a link that
          # succeeded.  The Makefile wraps -lpthread in --whole-archive to prevent
          # it; this entry is what checks that the wrapping works.  It also needs
          # the static zlib, which zlib1g-dev provides.
          - {os: ubuntu-latest, label: linux-x86_64-static, static: '-static', platform: ''}
          # One macOS entry, building both architectures into one binary.
          #
          # This replaced two native entries, macos-latest for arm64 and
          # macos-13 for x86_64.  macos-13 had to go regardless: GitHub began
          # deprecating that image in September 2025 and withdrew it that
          # December, and a job asking for a label no runner claims queues
          # forever rather than failing.  Its Intel successor,
          # macos-15-intel, is itself the last x86_64 image and is scheduled
          # to go in 2027.
          #
          # What is lost, stated plainly: an arm64 runner can only EXECUTE the
          # arm64 slice, so the test suite below covers arm64 and the x86_64
          # half is compiled and linked but not run.  `make check-universal`
          # asserts that half exists, which a successful build does not --
          # a universal link missing its arch flags quietly emits a thin
          # binary for the host.
          #
          # The evidence that this is an acceptable trade is that the two
          # slices agree: split with lipo and run separately, both pass the
          # whole harness against the SAME golden checksums, so arm64 and
          # x86_64 macOS produce bit-identical output here -- no FMA
          # contraction or vectorisation divergence to catch.
          - {os: macos-latest,  label: macos-universal, static: '', platform: 'macos-universal'}
    steps:
      - uses: actions/checkout@v5

      - name: Install zlib
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y zlib1g-dev
          fi

      - name: Build
        working-directory: src
        run: |
          # PLATFORM is autodetected from uname everywhere but the universal
          # build, which is opt-in because it compiles every translation unit
          # twice.  An empty value leaves the detection alone.
          make STATIC="${{ matrix.static }}" PLATFORM="${{ matrix.platform }}"
          ./garlic --version

      - name: Both architectures present
        if: matrix.platform == 'macos-universal'
        working-directory: src
        run: make PLATFORM=macos-universal check-universal

      # On the universal build this runs the arm64 slice -- the only one an
      # arm64 runner can execute.  The x86_64 slice is covered by the step
      # above, which is existence and not behaviour; see the matrix comment.
      - name: Test
        run: sh test/run_tests.sh

      # A build with no warnings is worth keeping that way: -Wall is already on
      # by default, this just makes regressions visible without failing the run.
      #
      # Counted unique: a universal build compiles each translation unit once
      # per architecture, so a plain `grep -c` reports every warning twice and
      # the number is not comparable with the other jobs'.  Identical text
      # dedupes to one; a warning raised on only one architecture still counts,
      # because it is still one distinct line.
      - name: Warning count
        working-directory: src
        run: |
          make clean
          make STATIC="${{ matrix.static }}" PLATFORM="${{ matrix.platform }}" 2>&1 | tee build.log
          echo "warnings: $(grep 'warning:' build.log | sort -u | wc -l | tr -d ' ')"

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zlib
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev tabix
      - name: Build instrumented
        working-directory: src
        run: |
          make STATIC= \
               OPTFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
               LINK_OPTS="-pthread -fsanitize=address,undefined"
      - name: Exercise every mode
        working-directory: src
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          E=../example
          set -e
          ./garlic --tped $E/chr21.tped.gz --tfam $E/chr21.tfam.gz --build hg18 --winsize 60 --error 0.001 --lod-cutoff 2.5 --size-bounds 500000 1000000 --froh --out s1 --quiet --force
          ./garlic --tped $E/chr21.tped.gz --tfam $E/chr21.tfam.gz --map $E/chr21.map.gz --weighted --build hg18 --winsize 60 --error 0.001 --lod-cutoff 2.5 --size-bounds 500000 1000000 --threads 2 --out s2 --quiet --force
          ./garlic --tped $E/chr21.tped.gz --tfam $E/chr21.tfam.gz --map $E/chr21.map.gz --cm --build hg18 --winsize 60 --error 0.001 --lod-cutoff 2.5 --size-bounds 0.5 1.0 --out s3 --quiet --force
          ./garlic --tped $E/chr21.tped.gz --tfam $E/chr21.tfam.gz --phased --build hg18 --winsize 60 --error 0.001 --lod-cutoff 2.5 --size-bounds 500000 1000000 --out s4 --quiet --force
          # example.GQ.tgls.gz is NOT tracked in this repository, so it cannot be
          # used here: on a fresh clone this step failed under set -e.  Generate a
          # GQ-30 file from the tracked TPED instead (GQ 30 is an error rate of
          # 0.001, so this also exercises the --error default path's equivalent).
          gzip -cd $E/chr21.tped.gz | awk '{printf "%s\t%s\t%s\t%s", $1,$2,$3,$4; n=(NF-4)/2; for(i=1;i<=n;i++) printf "\t30"; print ""}' | gzip > gq30.tgls.gz
          ./garlic --tped $E/chr21.tped.gz --tfam $E/chr21.tfam.gz --tgls gq30.tgls.gz --gl-type GQ --build hg18 --winsize 60 --lod-cutoff 2.5 --size-bounds 500000 1000000 --out s5 --quiet --force
          ./garlic --tped $E/example.tped.gz --tfam $E/example.tfam --tgls $E/example.tgls.gz --gl-type GL --build hg18 --winsize 60 --lod-cutoff 2.5 --size-bounds 500000 1000000 --out s6 --quiet --force
          ./garlic --tped $E/chr21.tped.gz --tfam $E/chr21.tfam.gz --build hg18 --auto-winsize --winsize 30 --error 0.001 --out s7 --quiet --force
          ./garlic --tped $E/chr21.tped.gz --tfam $E/chr21.tfam.gz --build hg18 --winsize-multi 30 40 --error 0.001 --out s8 --quiet --force
          ./garlic --tped $E/chr21.tped.gz --tfam $E/chr21.tfam.gz --build hg18 --error 0.001 --freq-only --out s9 --quiet --force
          ./garlic --tped $E/chr21.tped.gz --tfam $E/chr21.tfam.gz --build hg18 --winsize 60 --error 0.001 --lod-cutoff 2.5 --size-bounds 500000 1000000 --raw-lod --out s10 --quiet --force
          ./garlic --tped $E/chr21.tped.gz --tfam $E/chr21.tfam.gz --build hg18 --winsize 60 --error 0.001 --chr chr21 --lod-cutoff 2.5 --size-bounds 500000 1000000 --outdir sdir --out s11 --quiet --force
          # VCF paths.  The fixture is built from the tracked TPED by the same awk
          # the test suite uses, so CI needs no newly committed data.
          gzip -cd $E/chr21.tfam.gz | awk '{printf "\t%s", $2} END{print ""}' > vcf.samples
          {
            printf '##fileformat=VCFv4.2\n'
            printf '##FORMAT=<ID=GT,Number=1,Type=String,Description="Genotype">\n'
            printf '#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT'
            cat vcf.samples
            gzip -cd $E/chr21.tped.gz | awk '{
              delete seen; n = 0
              for (i = 5; i <= NF; i++) if ($i != "0" && !($i in seen)) { seen[$i] = 1; a[++n] = $i }
              if (n == 0) next
              if (n == 1) { ref = a[1]; alt = (ref == "A" ? "C" : (ref == "C" ? "A" : (ref == "G" ? "T" : "G"))) }
              else if (a[1] < a[2]) { ref = a[1]; alt = a[2] }
              else                  { ref = a[2]; alt = a[1] }
              line = $1 "\t" $4 "\t" $2 "\t" ref "\t" alt "\t.\tPASS\t.\tGT"
              for (i = 5; i <= NF; i += 2) {
                if ($i == "0" || $(i+1) == "0") g = "./."; else g = ($i == alt ? 1 : 0) "/" ($(i+1) == alt ? 1 : 0)
                line = line "\t" g
              }
              print line
            }'
          } > ci.vcf
          gzip -c ci.vcf > ci.vcf.gz
          gzip -cd $E/chr21.tfam.gz | awk '{print $2"\t"$1}' > ci.pop
          ./garlic --vcf ci.vcf    --pop ci.pop --build hg18 --winsize 60 --error 0.001 --lod-cutoff 2.5 --size-bounds 500000 1000000 --froh --out s12 --quiet --force
          ./garlic --vcf ci.vcf.gz --pop ci.pop --build hg18 --winsize 60 --error 0.001 --lod-cutoff 2.5 --size-bounds 500000 1000000 --out s13 --quiet --force
          ./garlic --vcf ci.vcf.gz --pop ci.pop --build hg18 --error 0.001 --freq-only --out s14 --quiet --force
          ./garlic --vcf ci.vcf.gz             --build hg18 --winsize 60 --error 0.001 --lod-cutoff 2.5 --size-bounds 500000 1000000 --out s15 --quiet --force
          # A real BGZF file, which is what a VCF from bcftools/GATK actually is:
          # multi-member gzip with a BC extra field per block plus an EOF marker.
          # igzstream reads it because BGZF is valid gzip, but that is worth having a
          # CI case for rather than a comment.
          bgzip -c ci.vcf > ci.bgzf.vcf.gz
          ./garlic --vcf ci.bgzf.vcf.gz --pop ci.pop --build hg18 --winsize 60 --error 0.001 --lod-cutoff 2.5 --size-bounds 500000 1000000 --out s16 --quiet --force
          cmp s13.roh.bed s16.roh.bed   # BGZF and plain gzip must agree

  # The command line reference in README and manual/flags.tex is generated from
  # the program's help strings.  If someone adds a flag without running
  # 'make docs', this fails -- which is the only thing keeping the two in sync.
  docs:
    name: docs are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zlib
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Regenerate and diff
        working-directory: src
        run: |
          make STATIC=
          make docs
          cd ..
          if ! git diff --quiet -- README manual/flags.tex; then
            echo "README or manual/flags.tex is out of date. Run 'make docs' in src/ and commit the result."
            git diff -- README manual/flags.tex
            exit 1
          fi
          echo "documentation matches the program"

  # Every command in the example walkthrough must actually run.  The first one
  # did not for years.
  example:
    name: example walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zlib
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Build
        working-directory: src
        run: make STATIC=
      - name: Run every documented command
        working-directory: example
        run: |
          GARLIC=$(pwd)/../src/garlic
          fail=0
          # The walkthrough writes into example/, which already holds the
          # shipped outputs, so --force is required.  read -r then word-split:
          # no argument in the file is quoted or contains a space.
          grep '^garlic ' example_README.txt > /tmp/cmds
          while read -r cmd; do
            echo "--- $cmd"
            # shellcheck disable=SC2086
            set -- ${cmd#garlic }
            if ! "$GARLIC" "$@" --force; then
              echo "    ^ FAILED"
              fail=1
            fi
          done < /tmp/cmds
          [ "$fail" -eq 0 ] || { echo "at least one documented command failed"; exit 1; }
          echo "all documented commands ran"
  # The win32 branch of the Makefile had never been built by anything: no
  # Windows toolchain was available while this branch was written and there was
  # no Windows runner.  Since 3c15065 that matters more than it used to --
  # threading is std::thread, which on MinGW comes from the toolchain's own
  # winpthreads and requires a GCC configured with the POSIX threading model.
  # With a win32-threads GCC libstdc++ does not define std::thread at all.
  windows:
    name: windows (msys2 mingw64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # coreutils for md5sum/wc/cut/tr, diffutils for cmp, gawk for awk --
          # the suite needs all of them and none is in the base install.
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib
            make
            coreutils
            diffutils
            gawk
            grep
            sed
            gzip

      - name: Toolchain threading model
        run: |
          # The load-bearing precondition, asserted rather than assumed: a
          # win32-threads GCC would fail later at compile time with a confusing
          # "no member named thread in namespace std", so fail here instead and
          # say why.
          g++ --version | head -1
          model=$(g++ -v 2>&1 | sed -n 's/.*Thread model: //p')
          echo "thread model: $model"
          case "$model" in
            posix) echo "ok: std::thread is available" ;;
            *) echo "ERROR: this GCC uses the '$model' threading model."
               echo "garlic needs a POSIX-threads GCC since 3c15065; libstdc++"
               echo "does not define std::thread under win32 threads."
               exit 1 ;;
          esac

      - name: Build
        working-directory: src
        run: |
          # No PLATFORM= here on purpose: uname -s reports MINGW64_NT-* and
          # the autodetect must map that to win32 by itself.  A regression to
          # linux would no longer fail at the link -- there is no -L on the
          # link line any more and zlib is -lz everywhere -- so it could pass
          # here while building with the wrong flags, which is why the check
          # below reads the platform back out of the Makefile.
          make
          # garlic.exe by name, not ./garlic: the target is garlic$(EXE) and
          # MinGW's ld produces the .exe.  The MSYS2 runtime would resolve the
          # bare name, but depending on that is what made the suffix implicit
          # in the first place.
          ls -l garlic.exe
          ./garlic.exe --version

      - name: Confirm the win32 configuration was the one built
        working-directory: src
        run: |
          plat=$(make -p 2>/dev/null | sed -n 's/^PLATFORM = //p' | head -1)
          echo "PLATFORM=$plat"
          [ "$plat" = "win32" ] || { echo "autodetect picked '$plat', not win32"; exit 1; }
          # zlib comes from mingw-w64-x86_64-zlib, not from lib/win32: that
          # archive is 32-bit i386 and a 64-bit MinGW skips it as incompatible,
          # which is how the first run of this job failed.
          echo "linked zlib: mingw-w64-x86_64-zlib (toolchain)"

      - name: Test suite
        run: |
          # This is what actually exercises std::thread: the thread-count
          # independence stage runs --threads 4, so if the first std::thread
          # constructor threw, those checks fail rather than silently passing.
          sh test/run_tests.sh
