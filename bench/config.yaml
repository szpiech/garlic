# Low-coverage ROH benchmark — configuration.
# Override on the command line, e.g.  snakemake --config small=true root=/path/to/smoke
root: /data/workspace/garlic-lowcov/bench/full      # all outputs live here
small: false                                         # smoke test: 24 Mb of chr21/22, one pedigree copy, depths 1 and 4

tools:
  garlic: /data/workspace/garlic-lowcov/bin/garlic
  rohan:  /data/workspace/garlic-lowcov/tools/rohan/bin/rohan   # optional; the rohan rules are skipped if absent
  plink:  /data/workspace/garlic-lowcov/env-plink/bin/plink     # PLINK v1.90b6.21; the plink rules are skipped if absent
  pedsim: /data/workspace/rohml/bin/ped-sim
  simmap: /data/workspace/rohml/maps/refined_mf_X.simmap        # Bherer map: chr pos male_cM female_cM
  intf:   /data/workspace/rohml/tools/ped-sim/interfere/nu_p_campbell_X.tsv

# GRCh37 lengths
chromosomes: {"20": 63025520, "21": 48129895, "22": 51304566}
depths: [1, 2, 4, 8]
rohan_depths: [1, 2, 4, 8]    # ROHan takes 4-6 h per 162 Mb BAM with two threads
run_rohan: false              # true: also run ROHan at rohan_depths (4.5-6 h per BAM; off by default)

founders:
  n_haplotypes: 400
  Ne: 20000
  mu: 1.25e-8
  seed: 2026
  demography: constant        # constant | bottleneck | small
  bottleneck_Ne: 500          # bottleneck: Ne from bottleneck_start to bottleneck_end generations ago
  bottleneck_start: 40
  bottleneck_end: 70
  small_Ne: 2000              # small: constant small population

cohort: pedigree              # pedigree: ped-sim pedigrees below | population: unrelated simulated individuals
population_cohort:
  n_individuals: 20
  ibd_max_time: 100           # truth = within-individual IBD segments coalescing <= this many generations ago
  ibd_min_span: 100000

pedigrees:                    # name -> ped-sim generation lines; "1:1_2" = branch 1's parents are branches 1 and 2
  fs: ["1 0 1", "2 0 2", "3 1 1 1:1_2"]
  c1: ["1 0 1", "2 0 2", "3 0 2", "4 1 1 1:1_2"]
  c2: ["1 0 1", "2 0 2", "3 0 2", "4 0 2", "5 1 1 1:1_2"]
  ob: ["1 0 1", "2 1 1"]
n_per_pedigree: 5

reads:  {length: 150, fragment: 350, fragment_sd: 40, system: HS25}
ascertainment_maf: 0.05
garlic:
  error: 0.001
  error_sweep: [1.0e-4, 1.0e-2]
  winsize: 60
  size_bounds: "500000 1000000"
score:
  min_len: 1000000
score_by_size:                # recall/precision by size class (0.1-0.5, 0.5-1, >1 Mb) against any-age IBD tracts
  min_truth: 100000            # tracts scored for recall and used as the precision reference
  max_tmrca: 1000              # recall counts tracts with TMRCA <= this many generations ('effective ROH')
plink:                        # PLINK 1.9 --homozyg, settings of Ceballos et al. 2018 (BMC Genomics 19:106)
  window_het: [3, 1]           # --homozyg-window-het: 3 for low-coverage WGS (their recommendation), 1 = default/array
  homozyg: {snp: 50, kb: 300, density: 50, gap: 1000, window-snp: 50, window-missing: 5, window-threshold: 0.05}
